<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkStash</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h2>Filters</h2>
        <button class="btn btn-filter" id="favorites-filter" style="width: 100%; margin-bottom: 1rem;">
          &#9733; Favorites Only
        </button>
      </div>
      <div class="sidebar-section">
        <h2>Tags</h2>
        <ul class="tag-list" id="tag-list"></ul>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <input type="text" class="search-input" id="search-input" placeholder="Search bookmarks...">
        <button class="btn btn-primary" id="add-bookmark-btn">+ Add Bookmark</button>
      </div>

      <div class="bookmark-list" id="bookmark-list"></div>
    </main>
  </div>

  <!-- Add/Edit Bookmark Modal -->
  <div class="modal-overlay" id="bookmark-modal">
    <div class="modal">
      <h2 id="modal-title">Add Bookmark</h2>
      <form id="bookmark-form">
        <input type="hidden" id="bookmark-id">
        <div class="form-group">
          <label for="bookmark-url">URL</label>
          <input type="url" id="bookmark-url" placeholder="https://example.com" required>
        </div>
        <div class="form-group">
          <label for="bookmark-title-input">Title</label>
          <input type="text" id="bookmark-title-input" placeholder="Page title" required>
        </div>
        <div class="form-group">
          <label for="bookmark-description">Description (optional)</label>
          <textarea id="bookmark-description" placeholder="Why is this bookmark useful?"></textarea>
        </div>
        <div class="form-group">
          <label for="bookmark-tags">Tags (comma-separated)</label>
          <input type="text" id="bookmark-tags" placeholder="web dev, reference, tutorial">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <h2>Delete Bookmark</h2>
      <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Are you sure you want to delete this bookmark? This action cannot be undone.</p>
      <div class="form-actions">
        <button class="btn btn-ghost" id="cancel-delete">Cancel</button>
        <button class="btn btn-danger" id="confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
